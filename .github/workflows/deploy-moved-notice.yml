name: Publish documentation moved notice

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-moved-notice.yml
      - moved-site/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy notice to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload notice
        uses: actions/upload-pages-artifact@v5
        with:
          path: moved-site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
