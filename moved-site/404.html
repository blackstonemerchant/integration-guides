<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <title>Documentación movida</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8f7fa;
        color: #241a20;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      p {
        max-width: 42rem;
        margin: 0;
        border-left: 0.3rem solid #b01d57;
        padding: 0.25rem 0 0.25rem 1.5rem;
        font-size: clamp(1.5rem, 4vw, 2.5rem);
        font-weight: 650;
        line-height: 1.2;
        letter-spacing: -0.025em;
      }

      a {
        color: #b01d57;
        text-decoration-thickness: 0.08em;
        text-underline-offset: 0.13em;
      }

      a:hover {
        color: #8a1542;
      }

      a:focus-visible {
        border-radius: 0.1em;
        outline: 0.18rem solid #b01d57;
        outline-offset: 0.2rem;
      }
    </style>
  </head>
  <body>
    <p>La documentación se ha movido a <a href="https://documentation.bmspay.com">documentation.bmspay.com</a>.</p>
  </body>
</html>
