[project]
name = "bpayd-integration-guides"
version = "1.0.0"
description = "Developer guides for Bpayd payment integration services"
readme = "readme.md"
requires-python = ">=3.12"

dependencies = [
    "zensical>=0.0.1",
]

[dependency-groups]
dev = ["ruff>=0.11.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
