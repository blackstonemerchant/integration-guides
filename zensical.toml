[project]
site_name = "Bpayd Documentation"
site_description = "Developer guides for Bpayd payment integration services"
site_author = "Blackstone Merchant Services, Inc."
site_url = "https://documentation.bmspay.com/"
copyright = "Copyright &copy; 2026 Blackstone Merchant Services, Inc."

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Sandbox Environment" = "getting-started/sandbox.md" },
  ] },
  { "Core APIs" = [
    { "Overview" = "core-apis/index.md" },
    { "API Reference" = [
      { "Overview" = "core-apis/api-reference/index.md" },
      { "Transactions" = "core-apis/api-reference/transactions.md" },
      { "Report" = "core-apis/api-reference/report.md" },
      { "Reporting" = "core-apis/api-reference/reporting.md" },
      { "Payment Links" = "core-apis/api-reference/payment-links.md" },
      { "Business Settings" = "core-apis/api-reference/business-settings.md" },
      { "Authentication" = "core-apis/api-reference/auth.md" },
      { "Recurring Billing" = "core-apis/api-reference/recurring-billing.md" },
      { "ACH Processor" = "core-apis/api-reference/ach-processor.md" },
      { "Check Processor" = "core-apis/api-reference/check-processor.md" },
      { "EBT Transactions" = "core-apis/api-reference/ebt-transactions.md" },
      { "Gift Card" = "core-apis/api-reference/gift-card.md" },
      { "Customers" = "core-apis/api-reference/customers.md" },
      { "Administration" = "core-apis/api-reference/administration.md" },
      { "Fraud Auto Deny Options" = "core-apis/api-reference/fraud-auto-deny-options.md" },
      { "Monetra Admin" = "core-apis/api-reference/monetra-admin.md" },
      { "Signature Capture" = "core-apis/api-reference/signature-capture.md" },
      { "Schemas" = "core-apis/api-reference/schemas.md" },
    ] },
    { "Payment Links" = "core-apis/payment-links.md" },
    { "ATH Mobile" = "core-apis/ath-mobile.md" },
  ] },
  { "Digital Wallets" = [
    { "Overview" = "digital-wallets/index.md" },
    { "Apple Pay" = [
      { "Web" = "digital-wallets/apple-pay/web.md" },
      { "iOS" = "digital-wallets/apple-pay/ios.md" },
      { "Flutter" = "digital-wallets/apple-pay/flutter.md" },
    ] },
    { "Google Pay" = [
      { "Web" = "digital-wallets/google-pay/web.md" },
      { "Android" = "digital-wallets/google-pay/android.md" },
      { "Flutter" = "digital-wallets/google-pay/flutter.md" },
    ] },
  ] },
  { "Security & 3DS" = [
    { "Overview" = "security/index.md" },
    { "3D Secure Web" = "security/3d-secure-web.md" },
    { "3D Secure Mobile" = "security/3d-secure-mobile.md" },
  ] },
  { "Plugins & Commerce" = [
    { "Overview" = "plugins/index.md" },
    { "WooCommerce" = "plugins/woocommerce.md" },
    { "Xero" = "plugins/xero.md" },
    { "Zoho CRM" = "plugins/zoho.md" },
    { "GoHighLevel" = "plugins/ghl.md" },
  ] },
  { "Tools & Operations" = [
    { "Check Payments with Token" = "operations/checks-with-token.md" },
  ] },
]

extra_css = [
  "stylesheets/extra.css",
]

[project.theme]
custom_dir = "overrides"
language = "en"
features = [
  "navigation.sections",
  "navigation.expand",
  "navigation.path",
  "navigation.top",
  "navigation.indexes",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "toc.follow",
  "content.code.copy",
  "content.code.select",
  "content.code.annotate",
  "content.tabs.link",
  "content.tooltips",
]

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/solid/globe"
link = "https://blackstonemerchant.com/"
name = "Blackstone Merchant Services Website"

[[project.extra.social]]
icon = "fontawesome/solid/envelope"
link = "mailto:info@blackstonemerchant.com"
name = "Contact Us"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = {
  permalink = true
}
pymdownx.arithmatex = {
  generic = true
}
pymdownx.betterem = {
  smart_enable = "all"
}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji = {
  emoji_generator = "zensical.extensions.emoji.to_svg",
  emoji_index = "zensical.extensions.emoji.twemoji",
}
pymdownx.highlight = {
  anchor_linenums = true,
  line_spans = "__span",
  pygments_lang_class = true,
}
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {
  custom_fences = [
    {
      name = "mermaid",
      class = "mermaid",
      format = "pymdownx.superfences.fence_code_format",
    },
  ],
}
pymdownx.tabbed = {
  alternate_style = true,
}
pymdownx.tasklist = {
  custom_checkbox = true
}
pymdownx.tilde = {}
