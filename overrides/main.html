{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
    
    function getTheme() {
      const scheme = document.body ? document.body.getAttribute("data-md-color-scheme") : "default";
      return scheme === "slate" ? "dark" : "default";
    }

    async function renderMermaid() {
      const elements = document.querySelectorAll("pre.mermaid:not([data-mermaid-done]), .mermaid:not([data-mermaid-done])");
      if (!elements.length) return;

      mermaid.initialize({
        startOnLoad: false,
        theme: getTheme(),
        securityLevel: "loose",
        flowchart: {
          useMaxWidth: true,
          htmlLabels: true,
          curve: "basis",
        },
      });

      for (const el of Array.from(elements)) {
        if (el.getAttribute("data-mermaid-done")) continue;
        el.setAttribute("data-mermaid-done", "true");
        const code = el.textContent.trim();
        if (!code) continue;

        const id = "mermaid" + Math.floor(Math.random() * 10000000);
        try {
          const { svg } = await mermaid.render(id, code);
          const div = document.createElement("div");
          div.className = "mermaid-container";
          div.style.display = "flex";
          div.style.justifyContent = "center";
          div.style.margin = "1.5rem 0";
          div.style.overflowX = "auto";
          div.innerHTML = svg;
          el.replaceWith(div);
        } catch (err) {
          console.error("Mermaid error:", err);
        }
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", () => renderMermaid());
    } else {
      renderMermaid();
    }
    
    window.addEventListener("load", () => renderMermaid());

    if (window.document$) {
      window.document$.subscribe(() => {
        setTimeout(renderMermaid, 50);
      });
    }

    const observer = new MutationObserver(() => renderMermaid());
    observer.observe(document.documentElement, { childList: true, subtree: true });
  </script>
{% endblock %}
